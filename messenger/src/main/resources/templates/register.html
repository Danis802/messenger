<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Создать аккаунт | Добро пожаловать</title>
    <!--    <script src="/static/script/register.js"></script>-->
    <link href="/static/style/registerStyle.css" rel="stylesheet">
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="card-header">
            <h1>Создать аккаунт</h1>
        </div>

        <form id="registerForm" th:action="@{/register}" method = "post" class="auth-form" novalidate>
            <div class="input-field">
                <label for="login">Имя пользователя</label>
                <div class="input-wrapper">
                    <input type="text" id="name" name="name" placeholder="Введите имя" autocomplete="username" required>
                </div>
            </div>

            <div class="input-field">
                <label for="login">Логин</label>
                <div class="input-wrapper">
                    <input type="text" id="login" name="login" placeholder="Введите логин" autocomplete="username" required>
                </div>
            </div>

            <div class="input-field">
                <label for="password">Пароль</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="Введите пароль" autocomplete="current-password" required>
                </div>
            </div>

            <button class="btn-submit" id="reg-submit">Создать →</button>

            <div class="form-footer">
                <a href="/login" id="registerLink">Войти в аккаунт</a>
            </div>
        </form>

        <div id="formMessage" class="form-message" role="alert" aria-live="polite"></div>
    </div>
</div>
</body>
</html>
