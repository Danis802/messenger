<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Создание аккаунта</title>
    <link rel="stylesheet" href="/static/style/register.css">
    <script src="/static/script/register.js"></script>
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="card-header">
            <h1>Регистрация</h1>
        </div>

        <form id="loginForm" class="auth-form" novalidate>
            <div class="input-field">
                <label for="name">Имя пользователя</label>
                <div class="input-wrapper">
                    <input type="text" id="name" name="name" placeholder="name" required>
                </div>
            </div>

            <div class="input-field">
                <label for="login">Логин</label>
                <div class="input-wrapper">
                    <input type="text" id="login" name="login" placeholder="username" required>
                </div>
            </div>

            <div class="input-field">
                <label for="password">Пароль</label>
                <div class="input-wrapper">
                    <input type="password" id="password" name="password" placeholder="Введите пароль" required>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submit-btn">Войти →</button>

            <div class="form-footer">
                <a href="/login" id="registerLink">Создать аккаунт</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
